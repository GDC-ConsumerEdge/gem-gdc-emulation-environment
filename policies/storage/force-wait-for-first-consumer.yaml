# GDC Robin StorageClasses may use the 'Immediate' binding mode. With this mode TopoLVM
# provisions the PVCs instantly across different nodes with free space. This causes an
# impossible scheduling deadlock (e.g., "Schedule pod to node2 and node3 simultaneously").
# This policy mutates all Robin storage classes to 'WaitForFirstConsumer', which delays
# provisioning until the pod is scheduled, allowing K8s to pick a single node and allocate
# all required PVCs on that same disk, which is on a single node.
apiVersion: mutations.gatekeeper.sh/v1beta1
kind: Assign
metadata:
  name: force-wait-for-first-consumer
spec:
  applyTo:
    - groups: ["storage.k8s.io"]
      kinds: ["StorageClass"]
      versions: ["v1"]
  match:
    name: "*robin*"
    kinds:
      - apiGroups: ["storage.k8s.io"]
        kinds: ["StorageClass"]
  location: "volumeBindingMode"
  parameters:
    assign:
      value: "WaitForFirstConsumer"
