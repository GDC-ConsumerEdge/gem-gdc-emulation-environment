default_language_version:
  python: python3
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Enforce newline at end of file
      - id: check-yaml
        name: YAML Linter
        files: \.(yaml|yml)$
        args: [--allow-multiple-documents]
        exclude: ^ansible/roles/.*/templates/
      - id: check-added-large-files
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        exclude: ^ansible/roles/.*/templates/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        name: Terraform Formatter
      - id: terraform_tflint
        name: Terraform Linter
      - id: terraform_validate
        name: Terraform Validate
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.4.0
    hooks:
      - id: ansible-lint
        name: Ansible Linter
        files: ^ansible/.*\.(yaml|yml)$
        exclude: ^(policies/|tests/)
        always_run: false
        additional_dependencies:
          - ansible
        language_version: python3
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        name: Shellcheck Validation
        files: \.sh$
  - repo: local
    hooks:
      - id: golangci-lint
        name: Golang Linter (golangci-lint)
        entry: bash -c 'cd operators/gem-nf-operator && go vet ./...'
        language: system
        files: ^operators/gem-nf-operator/.*\.go$
        pass_filenames: false
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Validate conventional commit message
        stages: [commit-msg]
        args: [--verbose]
  - repo: local
    hooks:
      - id: addlicense
        name: Validate License Headers
        entry: addlicense
        language: golang
        additional_dependencies: ['github.com/google/addlicense@latest']
        args: [-f, LICENSE]
        types: [text]
      - id: run-unit-tests
        name: Run Project Unit Tests (Terraform & Ansible)
        entry: ./scripts/run-unit-tests.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
