default_language_version:
  python: python3
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Enforce newline at end of file
      - id: check-yaml
        name: YAML Linter
        files: \.(yaml|yml)$
        args: [--allow-multiple-documents]
        exclude: ^(ansible/roles/.*/templates/|operators/gem-network-operator/crds/)
      - id: check-added-large-files
        name: Check for large files
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        name: YAML Formatter
        exclude: ^(ansible/roles/.*/templates/|operators/gem-network-operator/crds/)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
        name: Terraform Formatter
      - id: terraform_tflint
        name: Terraform Linter
      - id: terraform_validate
        name: Terraform Validate
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        name: Ansible Linter
        files: ^ansible/.*\.(yaml|yml)$
        exclude: ^(policies/|tests/|operators/)
        always_run: false
        additional_dependencies:
          - ansible
        language_version: python3
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        name: Shellcheck Validation
        files: \.sh$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        name: Ruff Linter
        args: [--fix]
      - id: ruff-format
        name: Ruff Formatter
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
        name: Golang Linter (golangci-lint)
        files: ^operators/gem-network-operator/
        args: [operators/gem-network-operator/...]
        pass_filenames: false
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Validate conventional commit message
        stages: [commit-msg]
        args: [--verbose]
  - repo: https://github.com/google/addlicense
    rev: v1.2.0
    hooks:
      - id: addlicense
        name: Validate License Headers
        args: [-f, LICENSE]
  - repo: local
    hooks:
      - id: unit-tests-terraform
        name: Run Terraform Unit Tests
        entry: ./scripts/run-unit-tests.sh --terraform
        language: system
        stages: [pre-push]
        files: ^(terraform/|scripts/run-unit-tests\.sh)
        pass_filenames: false
      - id: unit-tests-ansible
        name: Run Ansible Unit Tests
        entry: ./scripts/run-unit-tests.sh --ansible
        language: system
        stages: [pre-push]
        files: ^(ansible/|scripts/run-unit-tests\.sh)
        pass_filenames: false
      - id: unit-tests-golang
        name: Run Go Operator Unit Tests
        entry: ./scripts/run-unit-tests.sh --go
        language: system
        stages: [pre-push]
        files: ^(operators/gem-network-operator/|scripts/run-unit-tests\.sh)
        pass_filenames: false
      - id: unit-tests-python
        name: Run Python API Unit Tests
        entry: ./scripts/run-unit-tests.sh --python
        language: system
        stages: [pre-push]
        files: ^(api/|scripts/run-unit-tests\.sh)
        pass_filenames: false
