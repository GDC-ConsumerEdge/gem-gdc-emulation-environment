# An on-demand pipeline that tears down and deletes a single GEM cluster gracefully.
substitutions:
  _CLUSTER_NAME: gem-cluster-1
  _TF_STATE_BUCKET: "" # Derived as gem-${PROJECT_ID}-tfstate if empty
  _PROVISIONING_SA_EMAIL: "" # Derived via setup.sh if empty
  _GEM_GCP_ZONE: "" # Required
  _AR_LOCATION: "" # Must provide dynamically
  _AR_REPO: gem
  _BUILDER_TAG: latest
  _SSH_SECRET_NAME: gem-cluster-builder-ssh-key
  _SSH_SECRET_VERSION: latest

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - USER=gem
    - HOME=/workspace
    - ANSIBLE_HOST_KEY_CHECKING=False
    - ANSIBLE_FORCE_COLOR=True

tags:
  - 'gem-cluster-delete'
  - '${_CLUSTER_NAME}'
  - '${BRANCH_NAME}'

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/${_SSH_SECRET_NAME}/versions/${_SSH_SECRET_VERSION}
      env: SSH_PRIVATE_KEY

steps:
  # Setup environment and fetch Secret Manager SSH keys
  - id: setup
    name: ${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/builder:${_BUILDER_TAG}
    entrypoint: bash
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "CLUSTER_NAME=${_CLUSTER_NAME}"
      - "TF_STATE_BUCKET_IN=${_TF_STATE_BUCKET}"
      - "PROVISIONING_SA_EMAIL=${_PROVISIONING_SA_EMAIL}"
      - "GEM_GCP_ZONE=${_GEM_GCP_ZONE}"
    secretEnv: ["SSH_PRIVATE_KEY"]
    args: ["cloudbuild/steps/setup.sh"]

  # Run Ansible GKE Fleet Un-registration
  - id: ansible-cleanup
    name: ${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/builder:${_BUILDER_TAG}
    entrypoint: bash
    args: ["cloudbuild/steps/ansible-cleanup.sh"]

  # Run Terraform Destroy
  - id: terraform-destroy
    name: ${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/builder:${_BUILDER_TAG}
    entrypoint: bash
    args: ["cloudbuild/steps/tf-destroy.sh"]

serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/gem-cluster-builder@${PROJECT_ID}.iam.gserviceaccount.com'
