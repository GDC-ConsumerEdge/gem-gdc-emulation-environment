# Builds and publishes the GEM Cloud Build builder image used by
# `cluster-build.cloudbuild.yaml`. Run this once after `cloudbuild/setup.sh`,
# and re-run whenever the Dockerfile changes.
#
# gcloud builds submit \
#   --config=cloudbuild/builder/cloudbuild.yaml \
#   --substitutions=_AR_LOCATION=us-central1,_AR_REPO=gem,_IMAGE_TAG=latest \
#   cloudbuild/builder
substitutions:
  _AR_LOCATION: us-central1
  _AR_REPO: gem
  _IMAGE_TAG: latest

images:
  - "${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/builder:${_IMAGE_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/builder:${_IMAGE_TAG}
      - .
