              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - gatewayClassName
                - listeners
              properties:
                gatewayClassName:
                  type: string
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                listeners:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - port
                      - protocol
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
                      protocol:
                        type: string
                      allowedRoutes:
                        type: object
                        properties:
                          kinds:
                            type: array
                            items:
                              type: object
                              properties:
                                kind:
                                  type: string
                                group:
                                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
