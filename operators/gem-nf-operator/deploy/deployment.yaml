apiVersion: apps/v1
kind: Deployment
metadata:
  name: gem-nf-operator
  namespace: kube-system
  labels:
    app.kubernetes.io/name: gem-nf-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gem-nf-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gem-nf-operator
    spec:
      serviceAccountName: gem-nf-operator
      containers:
        - name: manager
          image: gcr.io/gke-release/gem-nf-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
