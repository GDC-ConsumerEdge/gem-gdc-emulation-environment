name: Code Quality Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'
            ansible:
              - 'ansible/**'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false
      - name: Setup TFLint
        if: steps.changes.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0
      - name: Run Core Pre-Commit Checks
        env:
          SKIP: terraform_fmt,terraform_tflint,terraform_validate,ansible-lint
        uses: pre-commit/action@v3.0.1
      - name: Validate Commit Message
        run: |
          git log -1 --pretty=%B > /tmp/commit_msg
          pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename /tmp/commit_msg
        shell: bash
      - name: Terraform Init Mocks
        if: steps.changes.outputs.terraform == 'true'
        run: |
          for dir in terraform/foundation terraform/admin-workstation terraform/cluster terraform/edge-router; do
            if [ -d "$dir" ]; then
              echo "Initializing $dir..."
              backend_file="$dir/backend.tf"
              [ -f "$backend_file" ] && mv "$backend_file" "${backend_file}.bak"
              terraform -cwd "$dir" init -backend=false
              [ -f "${backend_file}.bak" ] && mv "${backend_file}.bak" "$backend_file"
            fi
          done
        shell: bash
      - name: Run Terraform Pre-Commit Checks
        if: steps.changes.outputs.terraform == 'true'
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-added-large-files,yamlfmt,gitleaks,addlicense,shellcheck,ansible-lint
        uses: pre-commit/action@v3.0.1
      - name: Run Ansible Pre-Commit Checks
        if: steps.changes.outputs.ansible == 'true'
        env:
          SKIP: trailing-whitespace,end-of-file-fixer,check-yaml,check-added-large-files,yamlfmt,gitleaks,addlicense,shellcheck,terraform_fmt,terraform_tflint,terraform_validate
        uses: pre-commit/action@v3.0.1
