name: Lint, Format and Unit Test Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pre-commit:
    name: Pre-Commit Lint and Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap GEM Environment
        uses: ./.github/actions/setup-gem

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            terraform:
              - 'terraform/**'
            ansible:
              - 'ansible/**'
            golang:
              - 'operators/**'
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
              - '.golangci.yml'
            python:
              - 'api/**'
              - '**/*.py'
              - 'api/pyproject.toml'
              - 'api/uv.lock'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'operators/gem-network-operator/go.mod'

      - name: Setup uv
        if: steps.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Setup TFLint
        if: steps.changes.outputs.terraform == 'true'
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.50.0

      - name: Run Linters and Validators
        env:
          SKIP: terraform_fmt,terraform_tflint,terraform_validate,ansible-lint,golangci-lint
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      - name: Run Python Ruff Validations
        if: steps.changes.outputs.python == 'true'
        run: |
          cd api
          uv run ruff check --output-format=github .
          uv run ruff format --check .
        shell: bash

      - name: Run Golang Linter
        if: steps.changes.outputs.golang == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: operators/gem-network-operator
          args: --timeout=5m --config=../../.golangci.yml

      - name: Terraform Init Mocks
        if: steps.changes.outputs.terraform == 'true'
        run: |
          for dir in terraform/foundation terraform/admin-workstation terraform/cluster terraform/edge-router; do
            if [ -d "$dir" ]; then
              echo "Initializing $dir..."
              backend_file="$dir/backend.tf"
              [ -f "$backend_file" ] && mv "$backend_file" "${backend_file}.bak"
              terraform -chdir="$dir" init -backend=false
              [ -f "${backend_file}.bak" ] && mv "${backend_file}.bak" "$backend_file"
            fi
          done
        shell: bash

      - name: Run Terraform Formatter
        if: steps.changes.outputs.terraform == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        extra_args: terraform_fmt

      - name: Run Terraform Linter
        if: steps.changes.outputs.terraform == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        extra_args: terraform_tflint

      - name: Run Terraform Validater
        if: steps.changes.outputs.terraform == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        extra_args: terraform_validate

      - name: Run Ansible Linter
        if: steps.changes.outputs.ansible == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        extra_args: ansible-lint

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap GEM Environment
        uses: ./.github/actions/setup-gem

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'operators/gem-network-operator/go.mod'

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Run GEM Unit Tests
        run: |
          chmod +x ./scripts/run-unit-tests.sh
          ./scripts/run-unit-tests.sh
        shell: bash
