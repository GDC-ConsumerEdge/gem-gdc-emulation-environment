[project]
name = "gem-api"
version = "0.1.0"
description = "API for GDC Emulation Environment (GEM) cluster and workload management"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.141.1",
    "httpx2[http2]>=2.12.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["gem_api"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
