[defaults]
inventory = ansible/inventory.sh
host_key_checking = False
private_key_file = ~/.ssh/google_compute_engine
roles_path = ansible/roles
deprecation_warnings = False
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer, ansible.posix.profile_roles
forks = 20
# local_tmp lives on the control node, which may be macOS (no /dev/shm), so
# leave it at the portable Ansible default. remote_tmp targets the Linux nodes
# where the tmpfs speed-up applies; include ${USER} so the Ansible "become" user (root),
# Cloud Build (gem), and interactive SSH users each get an isolated directory in tmpfs
# instead of colliding in a single /dev/shm/ansible directory.
remote_tmp = /dev/shm/ansible-${USER}

# Performance: Fact Caching
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ansible/.ansible/fact_cache
fact_caching_timeout = 7200

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o IdentitiesOnly=yes
control_path = %(directory)s/%%C
