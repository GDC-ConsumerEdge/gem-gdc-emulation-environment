- name: Template gVisor containerd configuration files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/containerd/{{ item }}"
    mode: "0644"
  loop:
    - runsc.toml
    - runsc-debug.toml

- name: Inject gVisor runtime handlers into containerd config
  ansible.builtin.blockinfile:
    path: /etc/containerd/config.toml
    marker: "# {mark} ANSIBLE MANAGED GVISOR RUNTIME CONFIG"
    insertafter: '\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\]'
    content: |
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.gvisor]
        runtime_type = "io.containerd.runsc.v1"
        runtime_path = "/usr/local/bin/containerd-shim-runsc-v1"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.gvisor.options]
          ConfigPath = "/etc/containerd/runsc.toml"
          TypeUrl = "io.containerd.runsc.v1.options"

      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.gvisor-debug]
        runtime_type = "io.containerd.runsc-debug.v1"
        runtime_path = "/usr/local/bin/containerd-shim-runsc-v1"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.gvisor-debug.options]
          ConfigPath = "/etc/containerd/runsc-debug.toml"
          TypeUrl = "io.containerd.runsc.v1.options"
  notify: Restart containerd
