- name: Install required packages
  ansible.builtin.apt:
    name:
      - bridge-utils
      - jq
    state: present
    update_cache: true
- name: Ensure platform user exists for Traefik
  ansible.builtin.user:
    name: "{{ gem_user }}"
    state: present
    shell: /bin/bash
- name: Install Traefik
  ansible.builtin.import_role:
    name: workstation
    tasks_from: traefik.yaml
- name: Allow IP forwarding globally
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
