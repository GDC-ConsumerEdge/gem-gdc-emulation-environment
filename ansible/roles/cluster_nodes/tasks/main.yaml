- name: Install required packages
  ansible.builtin.apt:
    name:
      - jq
      - acl
      - curl
      - socat
      - conntrack
      - ipset
      - bridge-utils
      - lvm2
    state: present
    update_cache: true
  register: cluster_nodes_apt_status
  until: cluster_nodes_apt_status is success
  delay: 10
  retries: 3
- name: Download gVisor runsc binary
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/release/{{ gvisor_version }}/x86_64/runsc"
    dest: /usr/local/bin/runsc
    mode: "0755"

- name: Download gVisor containerd shim
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/release/{{ gvisor_version }}/x86_64/containerd-shim-runsc-v1"
    dest: /usr/local/bin/containerd-shim-runsc-v1
    mode: "0755"

- name: Ensure gVisor log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/log/runsc/panic
    - /var/log/runsc/debug
- name: Create cluster storage partition
  community.general.parted:
    device: /dev/disk/by-id/google-data
    number: 2
    label: gpt
    name: topolvm
    part_start: "{{ node_storage_size }}"
    part_end: 100%
    state: present
  become: true
- name: Wait for udev to populate cluster storage partition device
  ansible.builtin.command: udevadm settle
  changed_when: false
  become: true
- name: Create Volume Group topolvm-vg
  community.general.lvg:
    vg: topolvm-vg
    pvs: /dev/disk/by-id/google-data-part2
    state: present
  become: true
- name: Ensure GEM platform user exists
  ansible.builtin.user:
    name: "{{ gem_user }}"
    state: present
    shell: /bin/bash
- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ gem_user }}"
    groups: docker
    append: true
- name: Grant passwordless sudo to platform user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ gem_user }}"
    content: "{{ gem_user }} ALL=(ALL) NOPASSWD: ALL"
    mode: "0440"
- name: Authorize workstation SSH public key for platform user
  ansible.posix.authorized_key:
    user: "{{ gem_user }}"
    state: present
    key: "{{ lookup('file', '/tmp/ws_id_rsa.pub') }}"
- name: Configure kernel modules to load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/gdc-modules.conf
    content: |
      vxlan
      overlay
      br_netfilter
    mode: "0644"
- name: Load kernel modules immediately
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - vxlan
    - overlay
    - br_netfilter
- name: Increase inotify instances limit for cluster storage provider
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "8192"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    state: present
    reload: true
- name: Increase inotify watches limit for cluster storage provider
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    state: present
    reload: true
