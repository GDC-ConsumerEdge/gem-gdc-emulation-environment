- name: Create policies directory for gvisor
  ansible.builtin.file:
    path: "{{ gem_home }}/bmctl-workspace/{{ cluster_name }}/gvisor"
    state: directory
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0755"

- name: Template Kubernetes RuntimeClass manifest
  ansible.builtin.template:
    src: runtimeclass.yaml.j2
    dest: "{{ gem_home }}/bmctl-workspace/{{ cluster_name }}/gvisor/runtimeclass.yaml"
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0644"

- name: Deploy Kubernetes RuntimeClass for gVisor
  ansible.builtin.shell: |
    export KUBECONFIG="{{ gem_home }}/bmctl-workspace/{{ cluster_name }}/{{ cluster_name }}-kubeconfig"
    kubectl apply -f {{ gem_home }}/bmctl-workspace/{{ cluster_name }}/gvisor/runtimeclass.yaml
  args:
    executable: /bin/bash
  changed_when: true
