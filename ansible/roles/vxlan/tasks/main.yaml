- name: Assert host_octet is supplied by inventory
  ansible.builtin.assert:
    that:
      - host_octet is defined
      - host_octet | int >= 1
      - host_octet | int <= 254
    fail_msg: >-
      host_octet must be defined per-host in inventory (1-254).
      Inventory script ansible/inventory.sh emits it for all known hosts;
      if you added a new host, add host_octet to its hostvars.
- name: Set dynamic interface and service names
  ansible.builtin.set_fact:
    # Because the admin workstation and edge router will have connectivity to all
    # deployed GEM clusters, they will need a cluster-specific VXLAN interface name.
    # Each cluster node is unique and can use the default vxlan0 interface name, which
    # MetalLB will auto-detect, bind to and use to answer ARP requests. The following
    # configures a unique vxlan interface name derived from the cluster name on the
    # admin workstation and edge router, and will use vxlan0 on cluster nodes.
    vxlan_iface: >-
      {%- if inventory_hostname in ['gem_admin_ws', 'edge_router_host'] -%} {{ vxlan_primary_iface | trim }}{%- else -%} vxlan0{%- endif -%}

- name: Build list of VXLAN interface definitions
  ansible.builtin.set_fact:
    vxlan_definitions: >-
      {% set defs = [{'iface': vxlan_iface, 'vni': vxlan_id, 'ip_cidr': vxlan_ip ~ '/24'}] %}
      {% if secondary_networks is defined %}
      {% for net in secondary_networks %}
      {% if inventory_hostname in ['gem_admin_ws', 'edge_router_host'] %}
      {% set sec_if = 'sec-' ~ (cluster_name | replace('-', '') | truncate(6, True, '', 0)) ~ '-' ~ net.vlan_id %}
      {% else %}
      {% set sec_if = 'gdcenet0.' ~ net.vlan_id %}
      {% endif %}
      {% set sec_vni = (vxlan_id | int) + loop.index %}
      {% set sec_ip = (net.subnet | split('.'))[:3] | join('.') ~ '.' ~ host_octet ~ '/24' %}
      {% set _ = defs.append({'iface': sec_if, 'vni': sec_vni, 'ip_cidr': sec_ip}) %}
      {% endfor %}
      {% endif %}
      {{ defs }}

- name: Parse VXLAN definitions into native Ansible list
  ansible.builtin.set_fact:
    vxlan_defs_list: "{{ vxlan_definitions | from_yaml }}"

- name: Template declarative systemd virtual network devices (.netdev)
  ansible.builtin.template:
    src: vxlan.netdev.j2
    dest: "/etc/systemd/network/10-{{ item.iface }}.netdev"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ vxlan_defs_list }}"
  notify: Restart systemd-networkd

- name: Template declarative systemd network profiles (.network)
  ansible.builtin.template:
    src: vxlan.network.j2
    dest: "/etc/systemd/network/10-{{ item.iface }}.network"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ vxlan_defs_list }}"
  notify: Restart systemd-networkd

- name: Template firewall TCP MSS clamping oneshot service
  ansible.builtin.template:
    src: vxlan-tcpmss.service.j2
    dest: "/etc/systemd/system/vxlan-tcpmss-{{ cluster_name }}.service"
    mode: "0644"
    owner: root
    group: root
  vars:
    vxlan_interfaces: "{{ vxlan_defs_list }}"


- name: Enable and start TCP MSS clamping firewall service
  ansible.builtin.systemd:
    name: "vxlan-tcpmss-{{ cluster_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
