- name: Assert host_octet is supplied by inventory
  ansible.builtin.assert:
    that:
      - host_octet is defined
      - host_octet | int >= 1
      - host_octet | int <= 254
    fail_msg: >-
      host_octet must be defined per-host in inventory (1-254).
      Inventory script ansible/inventory.sh emits it for all known hosts;
      if you added a new host, add host_octet to its hostvars.
- name: Set dynamic interface and service names
  ansible.builtin.set_fact:
    vxlan_iface: "{{ vxlan_primary_iface }}"
    vxlan_service: "vxlan-{{ cluster_name }}.service"
    vxlan_script: "/usr/local/bin/setup-vxlan-{{ cluster_name }}.sh"
- name: Template the VXLAN setup script
  ansible.builtin.template:
    src: setup-vxlan.sh.j2
    dest: "{{ vxlan_script }}"
    mode: "0755"
    owner: root
    group: root
- name: Template the systemd service for VXLAN persistence
  ansible.builtin.template:
    src: vxlan.service.j2
    dest: "/etc/systemd/system/{{ vxlan_service }}"
    mode: "0644"
    owner: root
    group: root
- name: Enable and start the per-cluster VXLAN service
  ansible.builtin.systemd:
    name: "{{ vxlan_service }}"
    enabled: true
    state: started
    daemon_reload: true
