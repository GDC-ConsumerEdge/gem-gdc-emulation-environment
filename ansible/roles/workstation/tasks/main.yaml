- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - acl
    state: present
    update_cache: true
- name: Ensure GEM platform user exists
  ansible.builtin.user:
    name: "{{ gem_user }}"
    state: present
    shell: /bin/bash
- name: Suppress default login messages for platform user
  ansible.builtin.file:
    path: "{{ gem_home }}/.hushlogin"
    state: touch
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
- name: Create GEM MOTD
  ansible.builtin.copy:
    src: gem-motd.ans
    dest: /etc/gem-motd.ans
    owner: root
    group: root
    mode: "0644"
- name: Enable GEM logo on login shell
  ansible.builtin.blockinfile:
    path: "{{ gem_home }}/.bashrc"
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0644"
    create: true
    marker: "# {mark} GEM MOTD"
    block: |
      if shopt -q login_shell; then
          cat /etc/gem-motd.ans
          echo ""
          /etc/update-motd.d/98-reboot-required
      fi
- name: Configure GOOGLE_APPLICATION_CREDENTIALS for the user
  ansible.builtin.lineinfile:
    path: "{{ gem_home }}/.bashrc"
    line: "export GOOGLE_APPLICATION_CREDENTIALS={{ gem_home }}/bm-gcr.json"
    create: true
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0644"
- name: Download kubectl version {{ kubectl_version }}
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/sbin/kubectl
    mode: "0755"
    checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0700"
- name: Install Helm
  ansible.builtin.command: /tmp/get_helm.sh
  args:
    creates: /usr/local/bin/helm
- name: Create baremetal directory
  ansible.builtin.file:
    path: "{{ gem_home }}/baremetal"
    state: directory
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0755"
- name: Download bmctl version {{ bmctl_version }}
  ansible.builtin.command: >
    gcloud storage cp gs://anthos-baremetal-release/bmctl/{{ bmctl_version }}/linux-amd64/bmctl /usr/local/sbin/bmctl-{{ bmctl_version }}
  args:
    creates: /usr/local/sbin/bmctl-{{ bmctl_version }}
- name: Make bmctl executable
  ansible.builtin.file:
    path: /usr/local/sbin/bmctl-{{ bmctl_version }}
    mode: "0755"
- name: Symlink bmctl to correct version
  ansible.builtin.file:
    src: /usr/local/sbin/bmctl-{{ bmctl_version }}
    dest: /usr/local/sbin/bmctl
    state: link
    force: true
- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: workstation_docker_check
  failed_when: false
  changed_when: false
- name: Download Docker install script
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0700"
  when: workstation_docker_check.rc != 0
- name: Install Docker
  ansible.builtin.command: sh /tmp/get-docker.sh
  when: workstation_docker_check.rc != 0
  changed_when: true
- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ gem_user }}"
    groups: docker
    append: true
- name: Configure Docker daemon MTU for VXLAN overlay
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "mtu": 1410
      }
    mode: "0644"
  notify: Restart Docker service
- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ gem_home }}/.ssh"
    state: directory
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
    mode: "0700"
- name: Generate SSH keypair for platform user
  community.crypto.openssh_keypair:
    path: "{{ gem_home }}/.ssh/id_rsa"
    type: rsa
    size: 2048
    owner: "{{ gem_user }}"
    group: "{{ gem_user }}"
# Publish the platform user's SSH keypair so the cluster module and the
# Cloud Build cluster pipeline can both authenticate to cluster nodes as
# `gem` without each having to manage its own key. Two outputs:
#   - The public key is written to the workstation's `workstation_pubkey`
#     instance metadata, which terraform/cluster reads to authorize the
#     `gem` user on each node.
#   - The private key is mirrored into the Secret Manager secret that
#     terraform/cloudbuild creates, where Cloud Build reads it at submit time.
# Both pushes happen via gcloud impersonating tf-provisioner@,  matching the
# existing baremetal-gcr SA-key flow below, and avoiding any new IAM grants on
# the workstation's default Compute SA.
# Cloud Build integration is opt-in: it activates only when the Secret Manager
# secret created by terraform/cloudbuild already exists. This keeps the
# workstation playbook fully self-contained for users running the classic
# local workflow (foundation → workstation → cluster) who never set up Cloud
# Build,  for them the whole block below is skipped.
- name: Read platform user's SSH public key
  ansible.builtin.slurp:
    src: "{{ gem_home }}/.ssh/id_rsa.pub"
  register: workstation_pubkey_file

# The argv form keeps the --metadata value a single argument; the public
# key contains a space (`ssh-rsa <blob>`) a folded string would split on.
- name: Publish workstation SSH pubkey to instance metadata
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - gcloud
      - compute
      - instances
      - add-metadata
      - gem-admin-ws
      - "--zone={{ gcp_zone }}"
      - "--project={{ gcp_project_id }}"
      - "--impersonate-service-account=tf-provisioner@{{ gcp_project_id }}.iam.gserviceaccount.com"
      - "--metadata=workstation_pubkey={{ (workstation_pubkey_file.content | b64decode).strip() }}"
  changed_when: true

- name: Determine whether the Cloud Build SSH secret exists
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - gcloud
      - secrets
      - describe
      - gem-cluster-builder-ssh-key
      - "--project={{ gcp_project_id }}"
      - "--impersonate-service-account=tf-provisioner@{{ gcp_project_id }}.iam.gserviceaccount.com"
  register: workstation_ssh_secret
  failed_when: false
  changed_when: false

- name: Integrate the workstation SSH key with Cloud Build
  when: workstation_ssh_secret.rc == 0
  block:
    - name: Read platform user's SSH private key
      ansible.builtin.slurp:
        src: "{{ gem_home }}/.ssh/id_rsa"
      register: workstation_privkey_file
      no_log: true
    # Cluster nodes trust this key via terraform/cluster's `workstation_pubkey`
    # metadata, but the workstation does not authorize it for itself,  so a
    # non-interactive caller (Cloud Build) holding the matching private key can
    # reach the cluster nodes but not the workstation. This closes that gap.
    - name: Authorize platform user's key for inbound SSH
      ansible.posix.authorized_key:
        user: "{{ gem_user }}"
        key: "{{ workstation_pubkey_file.content | b64decode }}"
        state: present
    - name: Check current SSH private key version in Secret Manager
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - gcloud
          - secrets
          - versions
          - access
          - latest
          - --secret=gem-cluster-builder-ssh-key
          - "--project={{ gcp_project_id }}"
          - "--impersonate-service-account=tf-provisioner@{{ gcp_project_id }}.iam.gserviceaccount.com"
      register: workstation_ssh_secret_current
      failed_when: false
      changed_when: false
      no_log: true
    - name: Publish SSH private key to Secret Manager
      delegate_to: localhost
      become: false
      ansible.builtin.shell:
        cmd: >
          gcloud secrets versions add gem-cluster-builder-ssh-key
          --data-file=-
          --project={{ gcp_project_id }}
          --impersonate-service-account=tf-provisioner@{{ gcp_project_id }}.iam.gserviceaccount.com
        stdin: "{{ (workstation_privkey_file.content | b64decode) }}"
      when: >
        workstation_ssh_secret_current.rc != 0 or
        workstation_ssh_secret_current.stdout != (workstation_privkey_file.content | b64decode)
      changed_when: true
      no_log: true
- name: Check if Anthos Service Account Key exists on workstation
  ansible.builtin.stat:
    path: "{{ gem_home }}/bm-gcr.json"
  register: workstation_ws_sa_key
- name: Clean up corrupt Anthos Service Account Key on workstation if present
  ansible.builtin.file:
    path: "{{ gem_home }}/bm-gcr.json"
    state: absent
  # Only remove an empty/corrupt key. Deleting a valid key here would orphan it,
  # because the regeneration tasks below are gated on the stat captured *before*
  # this task and would skip recreation, leaving the workstation with no key.
  when: workstation_ws_sa_key.stat.exists and workstation_ws_sa_key.stat.size == 0
- name: Increase inotify max_user_watches on admin workstation
  become: true
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    state: present
    reload: true
- name: Increase inotify max_user_instances on admin workstation
  become: true
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "8192"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    state: present
    reload: true
- name: Generate and copy Anthos Service Account Key
  block:
    - name: Generate Anthos Service Account Key dynamically
      delegate_to: localhost
      become: false
      ansible.builtin.command: |
        gcloud iam service-accounts keys create /tmp/bm-gcr.json \
        --iam-account=baremetal-gcr@{{ gcp_project_id }}.iam.gserviceaccount.com \
        --project={{ gcp_project_id }} \
        --impersonate-service-account=tf-provisioner@{{ gcp_project_id }}.iam.gserviceaccount.com
      args:
        creates: /tmp/bm-gcr.json
      when: >
        not hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['exists'] or
        (hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['exists'] and
        hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['size'] == 0)
    - name: Copy Anthos Service Account Key to workstation
      ansible.builtin.copy:
        src: /tmp/bm-gcr.json
        dest: "{{ gem_home }}/bm-gcr.json"
        owner: "{{ gem_user }}"
        group: "{{ gem_user }}"
        mode: "0600"
      when: >
        not hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['exists'] or
        (hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['exists'] and
        hostvars[inventory_hostname]['workstation_ws_sa_key']['stat']['size'] == 0)
  rescue:
    - name: Clean up local Anthos Service Account Key if failed
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/bm-gcr.json
        state: absent
    - name: Ensure corrupt key is absent on workstation
      ansible.builtin.file:
        path: "{{ gem_home }}/bm-gcr.json"
        state: absent
    - name: Fail with clear message regarding key creation constraint
      ansible.builtin.fail:
        msg: >
          🚨 Failed to create the Anthos Service Account Key.

  always:
    - name: Clean up local Anthos Service Account Key (always)
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: /tmp/bm-gcr.json
        state: absent
      when: not workstation_ws_sa_key.stat.exists or (workstation_ws_sa_key.stat.exists and workstation_ws_sa_key.stat.size == 0)
