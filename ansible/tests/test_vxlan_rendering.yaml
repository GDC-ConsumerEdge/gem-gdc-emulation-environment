- name: Test VXLAN Hashing Setup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set mock inventory variables
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: gdc_nodes
        internal_ip: "{{ item.ip }}"
      loop:
        - {name: 'node1', ip: '10.10.0.8'}
        - {name: 'node2', ip: '10.10.0.4'}
        - {name: 'node3', ip: '10.10.0.7',}

- name: Test VXLAN Configuration Rendering for Administrative Workstation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    inventory_hostname: "gem_admin_ws"
    cluster_name: "rack-q8cui"
    vxlan_id: "2959013"
    internal_ip: "10.10.0.2"
    host_octet: "100"
    secondary_networks:
      - {vlan_id: 123, subnet: "172.16.12.0"}
      - {vlan_id: 456, subnet: "192.168.45.0"}
  tasks:
    - name: Ensure test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "/tmp/vxlan_ws_test"
        - "/tmp/vxlan_ws_test/network"

    - name: Compile dynamic VXLAN definitions list (Workstation)
      ansible.builtin.set_fact:
        vxlan_definitions: >-
          {% set defs = [{'iface': 'vx-rackq8-2959', 'vni': '2959013', 'ip_cidr': '10.200.13.100/24'}] %}
          {% if secondary_networks is defined and secondary_networks | length > 0 %}
          {% for net in secondary_networks %}
          {% set sec_if = 'sec-' ~ (cluster_name | replace('-', '') | truncate(6, True, '', 0)) ~ '-' ~ net.vlan_id %}
          {% set sec_vni = (vxlan_id | int) + loop.index %}
          {% set sec_ip = (net.subnet | split('.'))[:3] | join('.') ~ '.' ~ host_octet ~ '/24' %}
          {% set _ = defs.append({'iface': sec_if, 'vni': sec_vni, 'ip_cidr': sec_ip}) %}
          {% endfor %}
          {% endif %}
          {{ defs }}

    - name: Parse VXLAN definitions
      ansible.builtin.set_fact:
        vxlan_defs_list: "{{ vxlan_definitions | from_yaml }}"

    - name: Assert compiled names are compliant with IFNAMSIZ (<= 15 chars)
      ansible.builtin.assert:
        that:
          - "(item.iface | length) <= 15"
        fail_msg: "🚨 IFNAMSIZ ERROR: Dynamic interface '{{ item.iface }}' exceeds 15 characters limit!"
      loop: "{{ vxlan_defs_list }}"

    - name: Render NetDev and Network profiles
      ansible.builtin.template:
        src: "../roles/vxlan/templates/{{ tpl_item.tpl }}"
        dest: "/tmp/vxlan_ws_test/{{ tpl_item.dest }}"
        mode: "0644"
      loop:
        - {tpl: "vxlan.netdev.j2", dest: "10-vx-rackq8-2959.netdev"}
        - {tpl: "vxlan.network.j2", dest: "network/10-vx-rackq8-2959.network"}
      loop_control:
        loop_var: tpl_item
      vars:
        item:
          iface: "vx-rackq8-2959"
          vni: "2959013"
          ip_cidr: "10.200.13.100/24"

    - name: Slurp rendered files
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: rendered_files
      loop:
        - "/tmp/vxlan_ws_test/10-vx-rackq8-2959.netdev"
        - "/tmp/vxlan_ws_test/network/10-vx-rackq8-2959.network"

    - name: Verify Workstation NetDev parameters (Name and MTU)
      ansible.builtin.assert:
        that:
          - "'Name=vx-rackq8-2959' in (rendered_files.results[0].content | b64decode)"
          - "'MTUBytes=1410' in (rendered_files.results[0].content | b64decode)"
          - "'VNI=2959013' in (rendered_files.results[0].content | b64decode)"
        fail_msg: "Workstation NetDev parameters validation failed!"

    - name: Clean up Workstation test directory
      ansible.builtin.file:
        path: "/tmp/vxlan_ws_test"
        state: absent

- name: Test VXLAN Configuration Rendering for Cluster worker Nodes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    inventory_hostname: "node1"
    cluster_name: "rack-q8cui"
    vxlan_id: "2959013"
    internal_ip: "10.10.0.8"
    host_octet: "2"
    secondary_networks:
      - {vlan_id: 123, subnet: "172.16.12.0"}
      - {vlan_id: 456, subnet: "192.168.45.0"}
  tasks:
    - name: Ensure test directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "/tmp/vxlan_node_test"
        - "/tmp/vxlan_node_test/network"

    - name: Compile dynamic VXLAN definitions list (Node)
      ansible.builtin.set_fact:
        vxlan_definitions: >-
          {% set defs = [{'iface': 'vxlan0', 'vni': '2959013', 'ip_cidr': '10.200.13.2/24'}] %}
          {% if secondary_networks is defined and secondary_networks | length > 0 %}
          {% for net in secondary_networks %}
          {% set sec_if = 'gdcenet0.' ~ net.vlan_id %}
          {% set sec_vni = (vxlan_id | int) + loop.index %}
          {% set sec_ip = (net.subnet | split('.'))[:3] | join('.') ~ '.' ~ host_octet ~ '/24' %}
          {% set _ = defs.append({'iface': sec_if, 'vni': sec_vni, 'ip_cidr': sec_ip}) %}
          {% endfor %}
          {% endif %}
          {{ defs }}

    - name: Parse VXLAN definitions
      ansible.builtin.set_fact:
        vxlan_defs_list: "{{ vxlan_definitions | from_yaml }}"

    - name: Assert dynamic names strictly match gdcenet0.X node patterns
      ansible.builtin.assert:
        that:
          - "item.iface == 'vxlan0' or item.iface.startswith('gdcenet0.')"
        fail_msg: "🚨 Naming Violation: Dynamic interface '{{ item.iface }}' violates GDC node naming convention!"
      loop: "{{ vxlan_defs_list }}"

    - name: Render NetDev and Network profiles for node
      ansible.builtin.template:
        src: "../roles/vxlan/templates/{{ tpl_item.tpl }}"
        dest: "/tmp/vxlan_node_test/{{ tpl_item.dest }}"
        mode: "0644"
      loop:
        - {tpl: "vxlan.netdev.j2", dest: "10-gdcenet0.123.netdev"}
        - {tpl: "vxlan.network.j2", dest: "network/10-gdcenet0.123.network"}
      loop_control:
        loop_var: tpl_item
      vars:
        item:
          iface: "gdcenet0.123"
          vni: "2959014"
          ip_cidr: "172.16.12.2/24"
        groups:
          gdc_nodes: ['node1', 'node2', 'node3']
        hostvars:
          node2: {internal_ip: '10.10.0.4'}
          node3: {internal_ip: '10.10.0.7'}

    - name: Slurp rendered files
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: node_rendered_files
      loop:
        - "/tmp/vxlan_node_test/10-gdcenet0.123.netdev"
        - "/tmp/vxlan_node_test/network/10-gdcenet0.123.network"

    - name: Verify Node NetDev parameters
      ansible.builtin.assert:
        that:
          - "'Name=gdcenet0.123' in (node_rendered_files.results[0].content | b64decode)"
          - "'MTUBytes=1410' in (node_rendered_files.results[0].content | b64decode)"
          - "'VNI=2959014' in (node_rendered_files.results[0].content | b64decode)"
        fail_msg: "Node NetDev parameters validation failed!"

    - name: Verify Node FDB MAC forwarding peers
      ansible.builtin.assert:
        that:
          - "'Destination=10.10.0.4' in (node_rendered_files.results[1].content | b64decode)"
          - "'Destination=10.10.0.7' in (node_rendered_files.results[1].content | b64decode)"
        fail_msg: "Node Bridge FDB peer configurations validation failed!"

    - name: Clean up Node test directory
      ansible.builtin.file:
        path: "/tmp/vxlan_node_test"
        state: absent

- name: Test VXLAN Configuration and TCPMSS Rendering for Edge Router
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    inventory_hostname: "edge_router_host"
    cluster_name: "rack-q8cui"
    vxlan_id: "2959013"
    internal_ip: "10.10.0.5"
    host_octet: "254"
    secondary_networks:
      - {vlan_id: 123, subnet: "172.16.12.0/24", gateway: "172.16.12.1"}
      - {vlan_id: 456, subnet: "192.168.45.0/24", gateway: "192.168.45.1"}
  tasks:
    - name: Ensure Edge Router test directory exists
      ansible.builtin.file:
        path: "/tmp/vxlan_er_test"
        state: directory
        mode: "0755"

    - name: Compile dynamic VXLAN definitions list (Edge Router)
      ansible.builtin.set_fact:
        er_vxlan_definitions: >-
          {% set defs = [{'iface': 'vx-rackq8-2959', 'vni': '2959013', 'ip_cidr': '10.200.13.254/24'}] %}
          {% for net in secondary_networks %}
          {% set sec_if = 'sec-' ~ (cluster_name | replace('-', '') | truncate(6, True, '', 0)) ~ '-' ~ net.vlan_id %}
          {% set sec_vni = (vxlan_id | int) + loop.index %}
          {% set sec_ip = net.gateway ~ '/' ~ (net.subnet | split('/') | last) %}
          {% set _ = defs.append({'iface': sec_if, 'vni': sec_vni, 'ip_cidr': sec_ip}) %}
          {% endfor %}
          {{ defs }}

    - name: Parse Edge Router VXLAN definitions
      ansible.builtin.set_fact:
        er_vxlan_defs_list: "{{ er_vxlan_definitions | from_yaml }}"

    - name: Assert Edge Router secondary interfaces use gateway IP and obey IFNAMSIZ
      ansible.builtin.assert:
        that:
          - "(er_vxlan_defs_list[1].iface | length) <= 15"
          - "er_vxlan_defs_list[1].iface == 'sec-rackq8-123'"
          - "er_vxlan_defs_list[1].ip_cidr == '172.16.12.1/24'"
          - "er_vxlan_defs_list[2].iface == 'sec-rackq8-456'"
          - "er_vxlan_defs_list[2].ip_cidr == '192.168.45.1/24'"
        fail_msg: "Edge Router secondary interface gateway IP or name assertion failed!"

    - name: Render TCP MSS clamping systemd service template
      ansible.builtin.template:
        src: "../roles/vxlan/templates/vxlan-tcpmss.service.j2"
        dest: "/tmp/vxlan_er_test/vxlan-tcpmss-rack-q8cui.service"
        mode: "0644"
      vars:
        vxlan_interfaces: "{{ er_vxlan_defs_list }}"

    - name: Slurp rendered TCP MSS clamping service
      ansible.builtin.slurp:
        src: "/tmp/vxlan_er_test/vxlan-tcpmss-rack-q8cui.service"
      register: tcpmss_rendered

    - name: Verify TCP MSS clamping rules for all VXLAN interfaces
      ansible.builtin.assert:
        that:
          - "'Description=GEM VXLAN TCP MSS Clamping (rack-q8cui)' in (tcpmss_rendered.content | b64decode)"
          - "'-o vx-rackq8-2959 -j TCPMSS --clamp-mss-to-pmtu' in (tcpmss_rendered.content | b64decode)"
          - "'-o sec-rackq8-123 -j TCPMSS --clamp-mss-to-pmtu' in (tcpmss_rendered.content | b64decode)"
          - "'-o sec-rackq8-456 -j TCPMSS --clamp-mss-to-pmtu' in (tcpmss_rendered.content | b64decode)"
        fail_msg: "TCP MSS clamping systemd unit failed assertions!"

    - name: Clean up Edge Router test directory
      ansible.builtin.file:
        path: "/tmp/vxlan_er_test"
        state: absent
