gem_user: "gem"
gem_home: "/home/{{ gem_user }}"
pod_cidr_blocks: "10.0.0.0/17"
services_cidr_blocks: "10.96.0.0/12"
max_pods_per_node: 250
# GCP Service Account to grant cluster-admin access via GKE Connect Gateway
# If not specified, we default to the GDC emulation service account or the Edge Container P4SA
gcp_cluster_admin_sa: "gem-cluster-admin@{{ gcp_project_id }}.iam.gserviceaccount.com"
gcp_edge_container_sa: "service-{{ gcp_project_number }}@gcp-sa-edgecontainer.iam.gserviceaccount.com"
# Mapping between GDC versions and their corresponding ABM and gVisor versions
emulated_gdc_versions:
  "1.13.0":
    abm_version: "1.34.100-gke.97"
    gvisor_version: "20241021.0"
  "1.12.1":
    abm_version: "1.33.300-gke.60"
    gvisor_version: "20241021.0"
  "1.12.0":
    abm_version: "1.33.300-gke.60"
    gvisor_version: "20241021.0"
  "1.11.1":
    abm_version: "1.32.700-gke.64"
    gvisor_version: "20241021.0"
# Default to the first key in the map (latest version) if not specified
emulate_gdc_version: "{{ emulated_gdc_versions.keys() | list | first }}"
bmctl_version: "{{ emulated_gdc_versions[emulate_gdc_version].abm_version }}"
gvisor_version: "{{ emulated_gdc_versions[emulate_gdc_version].gvisor_version }}"
# https://dl.k8s.io/release/stable.txt for the latest version
kubectl_version: "v1.36.0"
cluster_node_taints:
  - key: "node-role.kubernetes.io/master"
    effect: "PreferNoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    effect: "PreferNoSchedule"
# OPA Gatekeeper release version for validation and mutation
gatekeeper_version: "v3.22.2"

# Secondary networks are an optional configuration, and not required for GEM to function.
# If you do have a need for a secondary network(s), they are to be defined here.
# Up to 10 secondary networks are supported, and some examples are provided below.
secondary_networks:
  - name: "vlan-123"
    vlan_id: 123
    subnet: "172.16.12.0/24"
    gateway: "172.16.12.1"
    vip_pool: "172.16.12.200-172.16.12.250"
    pod_cidr: "10.12.0.0/22" # 1024 addresses
    per_node_ipam_size: 24
  - name: "vlan-234"
    vlan_id: 234
    subnet: "172.16.23.0/24"
    gateway: "172.16.23.1"
    vip_pool: "172.16.23.200-172.16.23.250"
    pod_cidr: "10.23.0.0/22"
    per_node_ipam_size: 24
  - name: "vlan-345"
    vlan_id: 345
    subnet: "172.16.34.0/24"
    gateway: "172.16.34.1"
    vip_pool: "172.16.34.200-172.16.34.250"
    pod_cidr: "10.34.0.0/22"
    per_node_ipam_size: 24
  - name: "vlan-456"
    vlan_id: 456
    subnet: "192.168.45.0/24"
    gateway: "192.168.45.1"
    vip_pool: "192.168.45.200-192.168.45.250"
    pod_cidr: "10.45.0.0/22"
    per_node_ipam_size: 24
  - name: "vlan-789"
    vlan_id: 789
    subnet: "192.168.78.0/24"
    gateway: "192.168.78.1"
    vip_pool: "192.168.78.200-192.168.78.250"
    pod_cidr: "10.78.0.0/22"
    per_node_ipam_size: 24
  - name: "vlan-890"
    vlan_id: 890
    subnet: "192.168.89.0/24"
    gateway: "192.168.89.1"
    vip_pool: "192.168.89.200-192.168.89.250"
    pod_cidr: "10.89.0.0/22"
    per_node_ipam_size: 24
  - name: "vlan-901"
    vlan_id: 901
    subnet: "192.168.90.0/24"
    gateway: "192.168.90.1"
    vip_pool: "192.168.90.200-192.168.90.250"
    pod_cidr: "10.90.0.0/22"
    per_node_ipam_size: 24

# To prevent virtual interface naming collisions when deploying multiple clusters sharing
# similar prefixes (e.g., gem-cluster-1 vs gem-cluster-2), we slice the first 4 digits of
# the VXLAN_ID emitted by inventory.sh and append it to the interface string.
# The maximum Linux interface length is 15 characters, so we ensure the interface name
# is <= 15 characters.
vxlan_primary_iface: "vx-{{ (cluster_name | replace('-', '') | truncate(6, True, '', 0)) }}-{{ (vxlan_id | string)[:4] }}"
vxlan_secondary_iface_prefix: "sec-{{ cluster_name | replace('-', '') | truncate(6, True, '', 0) }}"
