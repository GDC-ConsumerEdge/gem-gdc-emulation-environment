- name: Wait dynamically for GCE Guest Agent metadata synchronization
  hosts: cluster_nodes
  gather_facts: false
  tasks:
    - name: Poll SSH until public key is accepted
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 5
        timeout: 120

- name: Ensure GCP SSH Key exists locally
  hosts: localhost
  connection: local
  tasks:
    - name: Assert CLUSTER_NAME environment variable is set
      ansible.builtin.assert:
        that:
          - lookup('env', 'CLUSTER_NAME') != ""
        fail_msg: "🚫 ERROR: You must set the CLUSTER_NAME environment variable before running this playbook (e.g., export CLUSTER_NAME=gem-cluster-1)"
    - name: Assert CLUSTER_NAME does not exceed Kubernetes FQDN character limits
      ansible.builtin.assert:
        that:
          - (lookup('env', 'CLUSTER_NAME') | length) <= 26
        fail_msg: >-
          🚫 ERROR: CLUSTER_NAME '{{ lookup('env', 'CLUSTER_NAME') }}' is too long
          ({{ lookup('env', 'CLUSTER_NAME') | length }} characters). GEM cluster names must be 26
          characters or fewer to prevent GCE VM hostnames from exceeding Kubernetes' strict
          63-character metadata label limits.
    - name: Check if google_compute_engine key exists
      ansible.builtin.stat:
        path: "~/.ssh/google_compute_engine"
      register: gcp_ssh_key
    - name: Generate google_compute_engine key if missing
      ansible.builtin.command: gcloud compute config-ssh --quiet --project={{ gcp_project_id }}
      when: not gcp_ssh_key.stat.exists
      changed_when: true
- name: Fetch SSH Key from Workstation
  hosts: workstation
  become: true
  tasks:
    - name: Fetch platform user public key from workstation
      ansible.builtin.fetch:
        src: "{{ gem_home }}/.ssh/id_rsa.pub"
        dest: /tmp/ws_id_rsa.pub
        flat: true
- name: Setup SSH Access and Base OS on Cluster Nodes
  hosts: cluster_nodes
  become: true
  any_errors_fatal: true
  roles:
    - cluster_nodes
- name: Setup VXLAN on all GCE instances
  hosts: gdc_nodes
  become: true
  vars:
    cluster_name: "{{ tf_cluster_name }}"
  roles:
    - vxlan
- name: Deploy Google Distributed Cloud Hybrid Cluster
  hosts: workstation
  become: true
  vars:
    cluster_name: "{{ tf_cluster_name }}"
  roles:
    - gdc_deploy
    - topolvm
    - gatekeeper
    - secondary_networks
    - gvisor
- name: Configure gVisor container runtime on cluster nodes
  hosts: cluster_nodes
  become: true
  roles:
    - gvisor_node
