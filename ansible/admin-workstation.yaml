- name: Ensure GCP SSH Access is initialized
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    gcp_project: "{{ gcp_project_id }}"
    ws_name: "gem-admin-ws"
    gcp_zone: "us-central1-a"
  tasks:
    - name: Ensure GCP SSH Key exists locally
      ansible.builtin.stat:
        path: "~/.ssh/google_compute_engine"
      register: gcp_ssh_key
    - name: Generate google_compute_engine key if missing
      ansible.builtin.command: "gcloud compute config-ssh --quiet --project={{ gcp_project }}"
      when: not gcp_ssh_key.stat.exists
      changed_when: true
    - name: Trigger initial SSH connection to populate keys on host
      ansible.builtin.command: >
        gcloud compute ssh {{ ws_name }} --tunnel-through-iap --project={{ gcp_project }} --zone={{ gcp_zone }} --command="true"

      register: ssh_trigger
      changed_when: false
      until: ssh_trigger is success
      retries: 6
      delay: 5
- name: Prepare Administrative Workstation
  hosts: workstation
  become: true
  pre_tasks:
    - name: Perform APT package upgrades
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
    - name: Check if a reboot is required due to kernel updates
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
    - name: Reboot Admin Workstation to apply kernel updates
      ansible.builtin.reboot:
        msg: "Rebooting due to kernel update"
        connect_timeout: 10
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 10
        test_command: whoami
      when: reboot_required.stat.exists
  roles:
    - workstation
  tasks:
    - name: Setup GCS Sync for VXLAN Overlay
      ansible.builtin.import_tasks: roles/vxlan/tasks/gcs-overlay-sync.yaml
