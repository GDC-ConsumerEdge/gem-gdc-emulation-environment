apiVersion: networking.gke.io/v1
kind: Network
metadata:
  name: vlan-123
  annotations:
    networking.gke.io/gdce-vlan-id: "123"
    networking.gke.io/gdce-vlan-mtu: "1410"
    networking.gke.io/gdce-lb-service-vip-cidrs: '["172.16.10.200-172.16.10.250"]'
    networking.gke.io/gke-gateway-pod-cidr: "172.16.100.0/16"
    networking.gke.io/gdce-per-node-ipam-size: "24"
spec:
  type: L2
  IPAMMode: Internal
  nodeInterfaceMatcher:
    interfaceName: gdcenet0.123
  gateway4: "172.16.10.1"
  l2NetworkConfig:
    prefixLength4: 24
  dnsConfig:
    nameservers:
      - 8.8.8.8
---
apiVersion: networking.gke.io/v1
kind: GKEGatewayCIDR
metadata:
  name: vlan-123
spec:
  ip4cidr: 172.16.10.224/27
  network: vlan-123
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-123
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "gdcenet0.123",
      "mode": "bridge",
      "mtu": 1410,
      "ipam": {
        "type": "host-local",
        "subnet": "172.16.10.0/24",
        "gateway": "172.16.10.1"
      }
    }
