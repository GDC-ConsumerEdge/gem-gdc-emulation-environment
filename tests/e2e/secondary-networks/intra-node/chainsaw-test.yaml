# ==============================================================================
# TEST SUITE: Intra-Node Secondary Network & Gateway API Connectivity
#
# DESCRIPTION:
#   Validates secondary network provisioning (Multus CNI, IPAM, and GDC Network CR),
#   GDC Gateway API resources (GKEGatewayCIDR, Gateway, GKEL4Route, GKEEndpointSelector),
#   and end-to-end HTTP connectivity when client and server pods are co-located on
#   the SAME node via Kubernetes podAffinity.
#
# EXPECTED RESULTS:
#   - Physical GDC Connected:
#       PASS (Expected). Safe to run with any arbitrary or synthetic VLAN ID (e.g. VLAN 123)
#       because traffic is switched locally within the node's kernel datapath and does
#       not traverse physical Top-of-Rack (ToR) network switches.
#   - GEM Emulation Environment (GCE):
#       PASS (Expected). Validates local Multus interface attachment, IPAM claim allocation,
#       and CoreDNS Gateway API DNS resolution.
# ==============================================================================

apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secondary-networking-intra-node
spec:
  timeouts:
    delete: 3m
    cleanup: 3m
  steps:
    # Create the Secondary Network CR and wait for GDC NetworkReady status.
    - name: 1. Deploy Secondary Network CR
      try:
        - apply:
            file: 01-network.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: networking.gke.io/v1
              kind: Network
              metadata:
                name: vlan-123
              status:
                conditions:
                  - type: Ready
                    status: "True"
                  - type: CoreDNSReady
                    status: "True"
      cleanup: []

    # Deploy Gateway API resources (GKEGatewayCIDR, Gateway, GKEEndpointSelector, GKEL4Route).
    # NOTE: GKEGatewayCIDR must be created BEFORE backend pods so GDC's mutating webhook
    # can inject the gateway routing table entries into newly scheduled pods.
    - name: 2. Deploy Gateway API Resources
      try:
        - apply:
            file: 02-gateway-api.yaml
        - assert:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: Gateway
              metadata:
                name: test-secondary-network-gateway
              (length(status.addresses || `[]`) > `0`): true

    # Deploy Backend NGINX Server Pod attached to the secondary network (eth1).
    - name: 3. Deploy Backend Pod Attached to Secondary Network
      try:
        - apply:
            file: 03-server.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: test-secondary-network-server
              status:
                phase: Running

    # Deploy LoadBalancer Service on the secondary network and verify VIP allocation.
    - name: 4. Deploy LoadBalancer Service on Secondary Network
      try:
        - apply:
            file: 04-loadbalancer.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: test-secondary-network-lb
              status:
                loadBalancer:
                  ingress:
                    - (ip != null && ip != ''): true

    # Deploy Client Curl Job with podAffinity co-locating it on the same node as the server.
    # Verifies CoreDNS resolution for the Gateway URL (*.gkegw.cluster.local) and HTTP reachability.
    - name: 5. Verify Intra-Node End-to-End Multi-Network Connectivity
      try:
        - apply:
            file: 05-client.yaml
        - assert:
            timeout: 90s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: test-secondary-network-client
              ((status.succeeded || `0`) > `0`): true
