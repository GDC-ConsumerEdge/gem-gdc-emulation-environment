apiVersion: batch/v1
kind: Job
metadata:
  name: test-secondary-network-client
spec:
  template:
    metadata:
      annotations:
        networking.gke.io/default-interface: eth0
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"pod-network"},
            {"interfaceName":"eth1","network":"test-secondary-network"}
          ]
    spec:
      containers:
        - name: curl
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Testing Multi-Network Gateway API DNS ($TARGET_URL)..."
              until curl -s -f --connect-timeout 3 "$TARGET_URL"; do
                echo "Waiting for Gateway API endpoint..."
                sleep 2
              done
              echo "Gateway API DNS & HTTP reachability successful!"
          env:
            - name: TARGET_URL
              value: (join('.', ['http://test-secondary-network-gateway', $namespace, 'gkegw.cluster.local']))
      restartPolicy: Never
  backoffLimit: 4
