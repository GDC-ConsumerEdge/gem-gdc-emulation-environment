apiVersion: networking.gke.io/v1
kind: GKEGatewayCIDR
metadata:
  name: vlan-456
spec:
  ip4cidr: 192.168.45.224/27
  network: vlan-456
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test-secondary-network-gateway
  annotations:
    networking.gke.io/network: vlan-456
spec:
  gatewayClassName: gke-cluster-ip
  listeners:
    - name: test-secondary-network-service
      protocol: TCP
      port: 80
      allowedRoutes:
        kinds:
          - kind: GKEL4Route
---
apiVersion: networking.gke.io/v1
kind: GKEEndpointSelector
metadata:
  name: test-secondary-network-endpointselector
spec:
  network: vlan-456
  selector:
    matchLabels:
      app: test-secondary-network-svc
---
apiVersion: networking.gke.io/v1
kind: GKEL4Route
metadata:
  name: test-secondary-network-l4route
spec:
  parentRefs:
    - name: test-secondary-network-gateway
  rules:
    - name: test-secondary-network-service
      backendRefs:
        - kind: GKEEndpointSelector
          port: 80
          group: networking.gke.io
          name: test-secondary-network-endpointselector
