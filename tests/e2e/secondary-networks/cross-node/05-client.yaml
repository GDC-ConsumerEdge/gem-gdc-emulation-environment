apiVersion: batch/v1
kind: Job
metadata:
  name: test-secondary-network-client
spec:
  template:
    metadata:
      annotations:
        networking.gke.io/default-interface: eth0
        networking.gke.io/interfaces: |
          [
            {"interfaceName":"eth0","network":"pod-network"},
            {"interfaceName":"eth1","network":"vlan-456"}
          ]
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - test-secondary-network-svc
              topologyKey: kubernetes.io/hostname
      containers:
        - name: curl
          image: curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo "default")
              TARGET_URL="http://test-secondary-network-gateway.${NAMESPACE}.gkegw.cluster.local"
              echo "Testing Cross-Node Multi-Network Gateway API DNS ($TARGET_URL)..."
              MAX_RETRIES=30
              COUNT=0
              until curl -f --connect-timeout 3 "$TARGET_URL"; do
                COUNT=$((COUNT+1))
                if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "Endpoint not reachable after $MAX_RETRIES attempts, exiting to allow Job retry..."
                  exit 1
                fi
                echo "Waiting for Gateway API endpoint (attempt $COUNT/$MAX_RETRIES)..."
                sleep 2
              done
              echo "Cross-Node Gateway API DNS & HTTP reachability successful!"
      restartPolicy: Never
  backoffLimit: 4
