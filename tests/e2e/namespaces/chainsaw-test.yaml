apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restricted-namespaces
spec:
  steps:
    - try:
        - apply:
            file: tenant-rbac-setup.yaml
        - apply:
            file: namespaces-setup.yaml
        # 1. Creation Restrictions (Workloads)
        - apply:
            file: workloads-setup.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'forbidden by GDC policies')): true
        # 2. Standard Creation Restrictions (CLI run)
        # Covers the full restrictedNamespaces list from
        # policies/workload-limitations/gdc-limitations.yaml.j2 so a future
        # edit that drops a namespace from the constraint is caught here.
        # Chainsaw evaluates the expect.check against each resource in the
        # multi-doc apply, so every Pod must be rejected with the GDC
        # message for the step to pass.
        - apply:
            file: pods-in-restricted-namespaces.yaml
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'forbidden by GDC policies')): true
