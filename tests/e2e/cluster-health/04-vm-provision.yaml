apiVersion: vm.cluster.gke.io/v1
kind: VirtualMachineDisk
metadata:
  name: ubuntu-chainsaw-disk
spec:
  source:
    http:
      url: "https://cloud-images.ubuntu.com/releases/focal/release/ubuntu-20.04-server-cloudimg-amd64.img"
  size: 20Gi
  storageClassName: robin-vm-repl-2-block-immediate

---
apiVersion: vm.cluster.gke.io/v1
kind: VirtualMachine
metadata:
  name: ubuntu-chainsaw-vm
spec:
  osType: Linux
  compute:
    cpu:
      vcpus: 2
    memory:
      capacity: 2Gi
  disks:
    - boot: true
      driver: virtio
      virtualMachineDiskName: ubuntu-chainsaw-disk
  interfaces:
    - name: eth0
      networkName: pod-network
      default: true
