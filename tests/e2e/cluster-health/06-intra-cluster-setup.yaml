apiVersion: v1
kind: Pod
metadata:
  name: nginx-server
  labels:
    app: nginx-server
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
spec:
  selector:
    app: nginx-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
spec:
  selector:
    app: nginx-server
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-client-1
  labels:
    app: nginx-client
spec:
  containers:
    - name: client
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        # Enforce scheduling on a different node than the server pod
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - nginx-server
          topologyKey: "kubernetes.io/hostname"
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-client-2
  labels:
    app: nginx-client
spec:
  containers:
    - name: client
      image: curlimages/curl:latest
      command: ["sleep", "3600"]
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        # Enforce scheduling on a different node than the server pod
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - nginx-server
          topologyKey: "kubernetes.io/hostname"
        # Enforce scheduling on a different node than the other client pod
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - nginx-client
          topologyKey: "kubernetes.io/hostname"
