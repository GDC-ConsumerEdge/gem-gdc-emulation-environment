apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sds-write-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: robin-repl-2
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sds-writer-pod
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: alpine:latest
      command: ["sh", "-c", "echo -n GEM_SDS_PV_DATA_OK > /mnt/data/persist.txt"]
      volumeMounts:
        - name: data-volume
          mountPath: /mnt/data
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: sds-write-pvc
