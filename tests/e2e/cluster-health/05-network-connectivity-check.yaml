apiVersion: v1
kind: Pod
metadata:
  name: network-connectivity-pod
spec:
  restartPolicy: Never
  containers:
    - name: connectivity
      image: alpine:latest
      command:
        - sh
        - -c
        - |
          echo "DNS Connectivity Check"
          nslookup google.com || exit 1
          nslookup googleapis.com || exit 1
          echo "HTTP Outbound Connectivity Check"
          wget -qSO- --timeout=5 https://connectivitycheck.gstatic.com/generate_204 2>&1 |grep -q "HTTP/1.1 204 No Content" || exit 2
          echo "🟢 Network connectivity checks have passed."
